# Phase 2: mechanistic analysis of silent hint-following in MedGemma 4B (Mac, HF transformers).
seed: 0
model_id: google/medgemma-4b-it
device: auto

capture:
  # Phase 1 labels from the full TPU run; Phase 2 re-checks behaviour on the Mac.
  phase1_labels: outputs/phase1_hints/20261114-193610/labels.parquet
  n_questions: 375
  framings: [metadata, explicit, authority, patient]   # wrong-answer hints, plus none + sham
  layers: [9, 17, 22, 29]
