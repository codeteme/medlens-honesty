[project]
name = "medlens"
version = "0.1.0"
description = "Detecting and fixing unfaithful chain-of-thought in medical LLMs"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.15.0",
    "anthropic>=2.8.0",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "openai>=3.51.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "sae-lens>=6.55.5",
    "tabulate>=0.10.0",
    "tinker>=0.39.0",
    "torch>=2.15.0",
    "tqdm>=4.70.1",
    "transformers>=5.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medlens"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff.lint.per-file-ignores]
# Prompt/rubric text and test fixtures are kept verbatim rather than wrapped.
"src/medlens/blackbox/judge.py" = ["E501"]
"src/medlens/blackbox/probes.py" = ["E501"]
"scripts/phase2_interpret.py" = ["E501"]
"tests/*" = ["E501"]
